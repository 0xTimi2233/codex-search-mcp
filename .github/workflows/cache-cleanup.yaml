name: Cache Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: 清理已关闭 PR 缓存
    runs-on: ubuntu-latest
    steps:
      - name: 删除当前 PR 分支缓存
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh cache delete --all --ref "refs/pull/${PR_NUMBER}/merge" 2>/dev/null || true
